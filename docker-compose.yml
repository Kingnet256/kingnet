# KINGNET lab — one isolated network, bound to localhost only (never exposed to your LAN).
name: kingnet
services:
  kingmail:                       # the realistic LAB target (not a real mail service)
    build: ./targets/kingmail
    environment:
      KINGMAIL_SECRET: "kingnet-lab-secret-change-me"
      OAUTH_MAILBACKUP_REDIRECT: "http://localhost:8070/callback"   # the attacker app's callback
      OAUTH_MAILBACKUP_SECRET: "mailbackup-lab-secret"
    ports: ["127.0.0.1:8081:8080"]
    networks: [kingnet-lab]

  kingnet-proxy:                  # the AiTM engine (the "phishing link" the victim visits)
    build: ./proxy
    environment:
      TARGET_URL: "http://kingmail:8080"
      PROXY_PUBLIC_URL: "http://localhost:8443"
      CONSOLE_URL: "http://attacker-console:8080"
    ports: ["127.0.0.1:8443:8080"]
    depends_on: [kingmail, attacker-console]
    networks: [kingnet-lab]

  attacker-console:               # what the attacker sees: captures + session hijack
    build: ./console
    environment: { KINGMAIL_URL: "http://kingmail:8080" }
    volumes: ["./data:/app/data"]
    ports: ["127.0.0.1:9000:8080"]
    networks: [kingnet-lab]

  # ---- Phase 2: the DEFENSE demo. The same proxy, aimed at a passkey target, fails. ----
  kingvault:                      # passkey-protected LAB target (phishing-resistant)
    build: ./targets/kingvault
    environment:
      KINGVAULT_SECRET: "kingnet-lab-vault-secret-change-me"
      KINGVAULT_RP_ID: "localhost"
      KINGVAULT_ORIGIN: "http://localhost:8082"   # the real origin users reach directly
    ports: ["127.0.0.1:8082:8080"]
    networks: [kingnet-lab]

  kingnet-proxy-vault:            # the SAME AiTM engine, pointed at KingVault — it will lose
    build: ./proxy
    environment:
      TARGET_URL: "http://kingvault:8080"
      PROXY_PUBLIC_URL: "http://localhost:8444"   # a different origin → passkey relay rejected
      CONSOLE_URL: "http://attacker-console:8080"
    ports: ["127.0.0.1:8444:8080"]
    depends_on: [kingvault, attacker-console]
    networks: [kingnet-lab]

  # ---- Phase 3: OAuth consent-phishing scenario. The attacker's own app. ----
  mail-backup-pro:                # the malicious OAuth app — never sees a password
    build: ./oauth-app
    environment:
      KINGMAIL_PUBLIC: "http://localhost:8081"    # where the victim's BROWSER reaches KingMail
      KINGMAIL_INTERNAL: "http://kingmail:8080"    # server-to-server token + API
      SELF_PUBLIC: "http://localhost:8070"
      OAUTH_CLIENT_SECRET: "mailbackup-lab-secret"
    ports: ["127.0.0.1:8070:8080"]
    depends_on: [kingmail]
    networks: [kingnet-lab]

networks:
  kingnet-lab:
    driver: bridge
