<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · KingMail</title>
<style>
 :root{--bg:#f1f3f6;--card:#fff;--brand:#1a73e8;--ink:#202124;--muted:#5f6368;--err:#d93025}
 *{box-sizing:border-box} body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center}
 .card{background:var(--card);width:400px;max-width:94vw;border:1px solid #dadce0;border-radius:12px;padding:40px 40px 32px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
 .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;margin-bottom:8px}
 .logo .m{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#1a73e8,#4f9bff);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
 h1{font-size:22px;font-weight:500;margin:14px 0 2px} p.sub{color:var(--muted);margin:0 0 22px}
 label{font-size:13px;color:var(--muted);display:block;margin:14px 0 5px}
 input{width:100%;padding:12px 13px;border:1px solid #dadce0;border-radius:8px;font-size:15px}
 input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(26,115,232,.2)}
 button{margin-top:24px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
 .err{background:#fce8e6;color:var(--err);border-radius:8px;padding:9px 12px;font-size:13px;margin-top:14px}
 .foot{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}
</style></head><body>
 <form class="card" method="post" action="/login">
  <div class="logo"><span class="m">K</span> KingMail</div>
  <h1>Sign in</h1><p class="sub">to continue to your mailbox</p>
  <label>Email</label>
  <input name="email" type="email" autocomplete="username" placeholder="you@kingmail.lab" required autofocus>
  <label>Password</label>
  <input name="password" type="password" autocomplete="current-password" placeholder="Password" required>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <button type="submit">Next</button>
  <div class="foot" style="margin-top:14px">New here? <a href="/register">Create an account</a></div>
  <div class="foot">KingMail · a KINGNET lab service (not a real mail provider)</div>
 </form>
</body></html>
