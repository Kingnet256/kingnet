<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · KingMail</title>
<style>
 :root{--brand:#1a73e8;--ink:#202124;--muted:#5f6368;--err:#c5221f}
 *{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:#f1f3f4}
 .card{width:400px;max-width:92vw;background:#fff;border:1px solid #e3e6eb;border-radius:14px;padding:28px 26px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
 .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px} .m{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#1a73e8,#4f9bff);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
 h1{font-size:22px;margin:16px 0 2px} .sub{color:var(--muted);margin-bottom:16px}
 label{font-size:13px;color:var(--muted)} input{width:100%;padding:10px 12px;border:1px solid #dadce0;border-radius:8px;font-size:15px;margin:5px 0 14px}
 button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
 .err{background:#fce8e6;color:var(--err);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
 .foot{margin-top:16px;color:var(--muted);font-size:12px;text-align:center}
</style></head><body>
 <form class="card" method="post" action="/register">
  <div class="logo"><span class="m">K</span> KingMail</div>
  <h1>Create your account</h1><p class="sub">A real lab mailbox you can sign in to and use.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label>Full name</label>
  <input name="name" placeholder="Alex Doe" autocomplete="name">
  <label>Email</label>
  <input name="email" type="email" placeholder="you@kingmail.lab" autocomplete="username" required autofocus>
  <label>Password</label>
  <input name="password" type="password" placeholder="Choose a password" autocomplete="new-password" required>
  <button type="submit">Create account &amp; sign in</button>
  <div class="foot" style="margin-top:14px">Already have one? <a href="/login">Sign in</a></div>
  <div class="foot">KingMail · a KINGNET lab service (not a real mail provider)</div>
 </form>
</body></html>
