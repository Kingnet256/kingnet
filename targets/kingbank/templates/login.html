<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · KingBank</title>
<style>
 :root{--brand:#0a3d62;--ink:#10202e;--muted:#5a6b7a}
 *{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:#eef3f7}
 .card{width:360px;max-width:92vw;background:#fff;border:1px solid #d7e2ec;border-radius:14px;padding:26px 24px;box-shadow:0 8px 30px rgba(10,61,98,.1)}
 .logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#0a3d62,#1b6ca8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
 h1{font-size:19px;margin:14px 0 2px} .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
 label{font-size:13px;color:var(--muted)} input{width:100%;padding:10px 12px;border:1px solid #cdd9e3;border-radius:9px;font-size:15px;margin:5px 0 14px}
 button{width:100%;padding:11px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
 .err{background:#fdecea;border:1px solid #f5a79e;color:#b1281b;border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:12px}
</style></head><body>
 <div class="card">
  <div class="logo">🏦</div>
  <h1>KingBank</h1><div class="sub">Secure online banking</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
   <label>Email</label><input name="email" value="victim@kingbank.lab" autocomplete="username">
   <label>Password</label><input name="password" type="password" autocomplete="current-password">
   <button type="submit">Sign in</button>
  </form>
 </div>
</body></html>
